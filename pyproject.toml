[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cql-minigrid"
version = "0.1.0"
description = "Team 12: discrete conservative Q-learning in MiniGrid"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1", "gymnasium==1.4.0", "minigrid==3.2.0",
  "stable-baselines3==2.9.0", "numpy==2.5.4", "matplotlib==3.11.2",
  "imageio==2.38.1", "imageio-ffmpeg==0.6.0", "pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
notebook = ["nbformat==5.11.1", "nbclient==0.10.4", "ipykernel==7.4.0"]

[project.scripts]
cql-minigrid = "cql_minigrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

name: CPU checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m cql_minigrid doctor
      - run: python -m cql_minigrid env-smoke
      - run: python -m cql_minigrid ppo --config configs/smoke.json --root artifacts/ci
      - run: python -m cql_minigrid collect --config configs/smoke.json --root artifacts/ci
      - run: python -m cql_minigrid train --config configs/smoke.json --root artifacts/ci --method dqn
      - run: python -m cql_minigrid train --config configs/smoke.json --root artifacts/ci --method cql
      - run: python -m cql_minigrid train --config configs/smoke.json --root artifacts/ci --method bc

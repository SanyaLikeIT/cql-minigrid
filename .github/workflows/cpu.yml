name: CPU checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m cql_minigrid doctor
      - run: python -m cql_minigrid env-smoke
      - run: python -m cql_minigrid pipeline --config configs/smoke.json --root artifacts/ci --reports artifacts/ci/reports
      - name: Smoke-test guided navigation fine-tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('configs/smoke.json').read_text())
          config['offline']['navigation_features'] = True
          config['guided'] = {'transitions': 128, 'episode_seed_start': 1300000,
                              'policy_seed_start': 300120}
          config['improvement'] = {
              'baseline': 'artifacts/ci/runs/strong/cql/seed-{seed}.pt',
              'test_seed_start': 30000, 'test_episodes': 2,
              'candidates': [{'name': 'geometry',
                              'dataset': 'artifacts/ci-navigation/datasets/guided.npz',
                              'initialize_from': 'artifacts/ci/runs/strong/cql/seed-{seed}.pt',
                              'offline': {'step_penalty': 0.005}}],
          }
          Path('artifacts/ci-navigation').mkdir(exist_ok=True)
          Path('artifacts/ci-navigation/config.json').write_text(json.dumps(config))
          PY
          python -m cql_minigrid guided-data --config artifacts/ci-navigation/config.json --root artifacts/ci-navigation
          python -m cql_minigrid improve --config artifacts/ci-navigation/config.json --root artifacts/ci-navigation
      - name: Run the small alpha study
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('configs/smoke.json').read_text())
          config['study'] = {
              'alphas': [0.0, 0.1, 1.0, 5.0],
              'datasets': {'strong': 'artifacts/ci/datasets/strong.npz'},
              'bc_datasets': ['strong'],
              'ppo_root': 'artifacts/ci/ppo',
          }
          Path('artifacts/ci/ablation-config.json').write_text(json.dumps(config))
          PY
          python -m cql_minigrid ablation --config artifacts/ci/ablation-config.json --root artifacts/ci-alpha --reports artifacts/ci-alpha/reports
